    "pandas==2.3.1",
    "pynndescent==0.5.13",
    "python-dotenv==1.1.1",
    "scikit-learn==1.6.1",
    "scipy==1.13.1",
    "torch>=2.2.0",
    "umap-learn==0.5.9.post2",
    "watchdog==6.0.0",
]
